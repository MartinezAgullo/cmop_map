<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CMOP — Common Medical Operational Picture</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="/css/styles.css"/>
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">

      <!-- ============================================================
           Header — wordmark, language, theme
           ============================================================ -->
      <div class="sidebar-header">
        <div class="wordmark">
          <h1>CMOP</h1>
        </div>
        <div class="sidebar-toggles">
          <div class="seg" id="langToggle" role="group" aria-label="Language">
            <button type="button" data-lang="en" aria-pressed="true">EN</button>
            <button type="button" data-lang="es" aria-pressed="false">ES</button>
          </div>
          <div class="seg" id="themeToggle" role="group" aria-label="Theme">
            <button type="button" data-theme="light" aria-pressed="true" data-i18n="theme.light">LIGHT</button>
            <button type="button" data-theme="dark" aria-pressed="false" data-i18n="theme.dark">DARK</button>
          </div>
        </div>
      </div>

      <!-- ============================================================
           Scenario + live feed state
           ============================================================ -->
      <div class="scenario-row">
        <span class="lab" data-i18n="scenario.label">SCN</span>
        <select id="scenarioSelect" aria-label="Scenario">
          <option value="" data-i18n="scenario.loading">Loading scenarios…</option>
        </select>
        <button class="btn-scenario" id="loadScenarioBtn" data-i18n="scenario.load">Load</button>
        <span class="live" id="liveIndicator"><i></i><em id="liveLabel">—</em></span>
      </div>

      <!-- ============================================================
           Triage ladder — census, alarm and filter in one object.
           Bands and counts are built by renderLadder() in app.js.
           ============================================================ -->
      <div class="ladder" id="ladder">
        <div class="ladder-top">
          <h2 data-i18n="ladder.title">Triage</h2>
          <p class="tot" id="ladderTotals"></p>
        </div>
        <div class="ladder-bar" id="ladderBar"></div>
        <div class="ladder-scale" id="ladderScale"></div>
      </div>

      <!-- ============================================================
           Tabs
           ============================================================ -->
      <div class="tabs" role="tablist">
        <button type="button" role="tab" aria-selected="true"  data-pane="roster"  data-i18n="tab.roster">Roster</button>
        <button type="button" role="tab" aria-selected="false" data-pane="filters" data-i18n="tab.filters">Filters</button>
        <button type="button" role="tab" aria-selected="false" data-pane="medevac" data-i18n="tab.medevac">MEDEVAC</button>
      </div>

      <div id="message" class="message"></div>

      <div class="panes">

        <!-- ---------- Roster ---------- -->
        <section class="pane on" id="pane-roster" role="tabpanel">
          <div class="roster-head">
            <span id="rosterLabel" data-i18n="roster.sorted">Sorted by urgency</span>
            <button type="button" id="clearAllFilters" data-i18n="roster.clear">Clear filters</button>
          </div>
          <div id="puntosList"></div>
        </section>

        <!-- ---------- Filters ---------- -->
        <section class="pane" id="pane-filters" role="tabpanel">

          <div class="fgroup">
            <div class="fgroup-head"><h3 data-i18n="filter.search">Search</h3></div>
            <input type="text" id="buscarNombre" class="search-input"
                   data-i18n-ph="filter.searchPlaceholder" placeholder="Callsign, unit, country…"/>
          </div>

          <div class="fgroup">
            <div class="fgroup-head">
              <h3 data-i18n="filter.categories">Categories</h3>
              <button type="button" class="btn-clear" id="clearCategories" data-i18n="action.clear">Clear</button>
            </div>

            <div class="checkbox-grid" id="categoryCheckboxes">
              <!-- Medical first: this is a medical picture -->
              <label class="filter-cb filter-cb--medical"><input type="checkbox" value="casualty" /><span data-i18n="cat.casualty">Casualty</span></label>
              <label class="filter-cb filter-cb--medical"><input type="checkbox" value="medical_facility" /><span data-i18n="cat.medical_facility">Med facility</span></label>
              <label class="filter-cb filter-cb--medical"><input type="checkbox" value="medevac_unit" /><span data-i18n="cat.medevac_unit">MEDEVAC</span></label>
              <label class="filter-cb filter-cb--medical"><input type="checkbox" id="casevacFilter" /><span data-i18n="cat.casevac">CASEVAC eligible</span></label>

              <label class="filter-cb"><input type="checkbox" value="infantry" /><span data-i18n="cat.infantry">Infantry</span></label>
              <label class="filter-cb"><input type="checkbox" value="armoured" /><span data-i18n="cat.armoured">Armoured</span></label>
              <label class="filter-cb"><input type="checkbox" value="artillery" /><span data-i18n="cat.artillery">Artillery</span></label>
              <label class="filter-cb"><input type="checkbox" value="reconnaissance" /><span data-i18n="cat.recon">Recon</span></label>
              <label class="filter-cb"><input type="checkbox" value="engineer" /><span data-i18n="cat.engineer">Engineer</span></label>
              <label class="filter-cb"><input type="checkbox" value="mortar" /><span data-i18n="cat.mortar">Mortar</span></label>
              <label class="filter-cb"><input type="checkbox" value="helicopter" /><span data-i18n="cat.helicopter">Helicopter</span></label>
              <label class="filter-cb"><input type="checkbox" value="uav" /><span>UAV</span></label>
              <label class="filter-cb"><input type="checkbox" value="ugv" /><span>UGV</span></label>
              <label class="filter-cb"><input type="checkbox" value="transportation" /><span data-i18n="cat.transport">Transport</span></label>
              <label class="filter-cb"><input type="checkbox" value="aircraft" /><span data-i18n="cat.aircraft">Aircraft</span></label>
              <label class="filter-cb"><input type="checkbox" value="fighter" /><span data-i18n="cat.fighter">Fighter</span></label>
              <label class="filter-cb"><input type="checkbox" value="bomber" /><span data-i18n="cat.bomber">Bomber</span></label>
              <label class="filter-cb"><input type="checkbox" value="missile" /><span data-i18n="cat.missile">Missile</span></label>
              <label class="filter-cb"><input type="checkbox" value="ship" /><span data-i18n="cat.ship">Ship</span></label>
              <label class="filter-cb"><input type="checkbox" value="destroyer" /><span data-i18n="cat.destroyer">Destroyer</span></label>
              <label class="filter-cb"><input type="checkbox" value="submarine" /><span data-i18n="cat.submarine">Submarine</span></label>
              <label class="filter-cb"><input type="checkbox" value="ground_vehicle" /><span data-i18n="cat.ground_vehicle">Ground veh.</span></label>
              <label class="filter-cb"><input type="checkbox" value="person" /><span data-i18n="cat.person">Person</span></label>
              <label class="filter-cb"><input type="checkbox" value="base" /><span data-i18n="cat.base">Base</span></label>
              <label class="filter-cb"><input type="checkbox" value="building" /><span data-i18n="cat.building">Building</span></label>
              <label class="filter-cb"><input type="checkbox" value="infrastructure" /><span data-i18n="cat.infrastructure">Infrastructure</span></label>
            </div>

            <!-- Casualty triage subfilter -->
            <div class="subfilter" id="subfilterCasualty" style="display:none;">
              <div class="subfilter-header">
                <span data-i18n="filter.triageLevel">Triage level</span>
                <button type="button" class="btn-clear" id="clearTriageFilter" data-i18n="action.clear">Clear</button>
              </div>
              <div class="subfilter-options" id="triageCheckboxes">
                <label class="filter-cb triage-option" style="--c:var(--t-red)"><input type="checkbox" value="RED" /><span data-i18n="triage.t1">T1 Immediate</span></label>
                <label class="filter-cb triage-option" style="--c:var(--t-yellow)"><input type="checkbox" value="YELLOW" /><span data-i18n="triage.t2">T2 Urgent</span></label>
                <label class="filter-cb triage-option" style="--c:var(--t-green)"><input type="checkbox" value="GREEN" /><span data-i18n="triage.t3">T3 Minimal</span></label>
                <label class="filter-cb triage-option" style="--c:var(--t-blue)"><input type="checkbox" value="BLUE" /><span data-i18n="triage.t4">T4 Expectant</span></label>
                <label class="filter-cb triage-option" style="--c:var(--t-black)"><input type="checkbox" value="BLACK" /><span data-i18n="triage.dead">Dead</span></label>
                <label class="filter-cb triage-option" style="--c:var(--t-unknown)"><input type="checkbox" value="UNKNOWN" /><span data-i18n="triage.unknown">Unknown</span></label>
              </div>
            </div>

            <!-- Medical facility role subfilter -->
            <div class="subfilter" id="subfilterMedFacility" style="display:none;">
              <div class="subfilter-header">
                <span data-i18n="filter.facilityRole">Facility role</span>
                <button type="button" class="btn-clear" id="clearMedFacilityFilter" data-i18n="action.clear">Clear</button>
              </div>
              <div class="subfilter-options" id="medFacilityCheckboxes">
                <label class="filter-cb"><input type="checkbox" value="medical_role_1" /><span data-i18n="role.f1">Role 1 — Aid post</span></label>
                <label class="filter-cb"><input type="checkbox" value="medical_role_2" /><span data-i18n="role.f2">Role 2 — Surgical</span></label>
                <label class="filter-cb"><input type="checkbox" value="medical_role_3" /><span data-i18n="role.f3">Role 3 — Field hospital</span></label>
                <label class="filter-cb"><input type="checkbox" value="medical_role_4" /><span data-i18n="role.f4">Role 4 — Definitive</span></label>
                <label class="filter-cb"><input type="checkbox" value="medical_other" /><span data-i18n="role.fOther">Other (R2B/R2E/Multi)</span></label>
              </div>
            </div>

            <!-- MEDEVAC role subfilter -->
            <div class="subfilter" id="subfilterMedevac" style="display:none;">
              <div class="subfilter-header">
                <span data-i18n="filter.medevacRole">MEDEVAC role</span>
                <button type="button" class="btn-clear" id="clearMedevacFilter" data-i18n="action.clear">Clear</button>
              </div>
              <div class="subfilter-options" id="medevacCheckboxes">
                <label class="filter-cb"><input type="checkbox" value="medevac_role_1" /><span data-i18n="role.m1">Role 1 — Immediate</span></label>
                <label class="filter-cb"><input type="checkbox" value="medevac_role_2" /><span data-i18n="role.m2">Role 2 — Forward</span></label>
                <label class="filter-cb"><input type="checkbox" value="medevac_role_3" /><span data-i18n="role.m3">Role 3 — Theater</span></label>
                <label class="filter-cb"><input type="checkbox" value="medevac_role_4" /><span data-i18n="role.m4">Role 4 — Definitive</span></label>
                <label class="filter-cb"><input type="checkbox" value="medevac_other" /><span data-i18n="role.mOther">Other (FW/Amb/Mech/Mort)</span></label>
              </div>
            </div>
          </div>

          <div class="fgroup">
            <div class="fgroup-head">
              <h3 data-i18n="filter.alliance">Alliance</h3>
              <button type="button" class="btn-clear" id="clearAlliance" data-i18n="action.clear">Clear</button>
            </div>
            <div class="checkbox-grid" id="allianceCheckboxes">
              <label class="filter-cb"><input type="checkbox" value="friendly" /><span class="alliance-dot" style="--dot-color:var(--a-friendly)"></span><span data-i18n="alliance.friendly">Friendly</span></label>
              <label class="filter-cb"><input type="checkbox" value="hostile" /><span class="alliance-dot" style="--dot-color:var(--a-hostile)"></span><span data-i18n="alliance.hostile">Hostile</span></label>
              <label class="filter-cb"><input type="checkbox" value="neutral" /><span class="alliance-dot" style="--dot-color:var(--a-neutral)"></span><span data-i18n="alliance.neutral">Neutral</span></label>
              <label class="filter-cb"><input type="checkbox" value="unknown" /><span class="alliance-dot" style="--dot-color:var(--a-unknown)"></span><span data-i18n="alliance.unknown">Unknown</span></label>
            </div>
          </div>
        </section>

        <!-- ---------- MEDEVAC ---------- -->
        <section class="pane" id="pane-medevac" role="tabpanel">
          <div class="fgroup">
            <div class="fgroup-head"><h3 data-i18n="routes.plan">Plan</h3></div>

            <div class="routes-input-row">
              <input type="text" id="routeTaskId" class="search-input routes-task-input"
                     data-i18n-ph="routes.taskPlaceholder" placeholder="Task ID…"/>
              <button class="btn-route-load" id="loadRoutesBtn" data-i18n="routes.load">Load</button>
            </div>

            <div id="routesStatus" class="routes-status"></div>

            <div class="routes-actions" style="display:none;" id="routesActions">
              <button class="btn-route-refresh" id="refreshRoutesBtn" data-i18n="routes.refresh">Refresh</button>
              <button class="btn-simulate" id="simulateBtn" onclick="toggleSimulation()" data-i18n="sim.start">Run</button>
              <button class="btn-restart" id="restartBtn" onclick="restartSimulation()" style="display:none;" data-i18n="sim.restart">Restart</button>
              <button class="routes-clear-btn" id="clearRoutesBtn" data-i18n="routes.clear">Clear routes</button>
            </div>
          </div>
        </section>

      </div>
    </aside>

    <!-- ================================================================
         Map
         ================================================================ -->
    <main class="map-container">
      <div id="map"></div>

      <div class="map-tools">
        <button type="button" onclick="mostrarFormularioNuevoPunto()" data-i18n="map.newEntity">New entity</button>
        <button type="button" onclick="fitToEntities()" data-i18n="map.fit">Fit</button>
      </div>

      <div class="map-legend">
        <b data-i18n="ladder.title">Triage</b>
        <span style="--c:var(--t-red)"><i></i>T1</span>
        <span style="--c:var(--t-yellow)"><i></i>T2</span>
        <span style="--c:var(--t-green)"><i></i>T3</span>
        <span style="--c:var(--t-blue)"><i></i>T4</span>
        <span style="--c:var(--t-black)"><i></i>KIA</span>
        <span style="--c:var(--t-unknown)"><i></i>?</span>
      </div>

      <div id="map-coords" class="map-coords"></div>

      <div id="map-ctx-menu" class="map-ctx-menu" style="display:none;">
        <button id="map-ctx-add" data-i18n="map.addHere">Add new entity here</button>
      </div>

      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p data-i18n="action.loading">Loading</p>
      </div>
    </main>
  </div>

  <!-- ================================================================
       Modal — create entity
       ================================================================ -->
  <div class="form-modal" id="formModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 data-i18n="form.title">New entity</h2>
        <button class="close-btn" onclick="cerrarFormularioNuevoPunto()" aria-label="Close">&times;</button>
      </div>

      <form id="nuevoPuntoForm">
        <div class="form-group">
          <label for="nombre" data-i18n="form.name">Name *</label>
          <input type="text" id="nombre" name="nombre" required />
        </div>

        <div class="form-group">
          <label for="descripcion" data-i18n="form.description">Description</label>
          <textarea id="descripcion" name="descripcion"></textarea>
        </div>

        <div class="form-group">
          <label for="categoria" data-i18n="form.category">Category *</label>
          <select id="categoria" name="categoria" required>
            <option value="" data-i18n="form.categoryPick">Select a category</option>

            <optgroup label="Military" data-i18n-label="form.grpMilitary">
              <option value="missile">missile</option>
              <option value="fighter">fighter</option>
              <option value="bomber">bomber</option>
              <option value="aircraft">aircraft</option>
              <option value="helicopter">helicopter</option>
              <option value="uav">uav</option>
              <option value="ugv">ugv</option>
              <option value="transportation">transportation</option>
              <option value="armoured">armoured</option>
              <option value="artillery">artillery</option>
              <option value="ship">ship</option>
              <option value="destroyer">destroyer</option>
              <option value="submarine">submarine</option>
              <option value="ground_vehicle">ground_vehicle</option>
              <option value="infantry">infantry</option>
              <option value="reconnaissance">reconnaissance</option>
              <option value="engineer">engineer</option>
              <option value="mortar">mortar</option>
              <option value="person">person</option>
              <option value="base">base</option>
              <option value="building">building</option>
              <option value="infrastructure">infrastructure</option>
            </optgroup>

            <optgroup label="Medical &amp; MEDEVAC" data-i18n-label="form.grpMedical">
              <option value="medical_facility">medical_facility</option>
              <option value="medevac_unit">medevac_unit</option>
            </optgroup>

            <optgroup label="Casualties" data-i18n-label="form.grpCasualties">
              <option value="casualty">casualty</option>
            </optgroup>

            <option value="default">default</option>
          </select>
        </div>

        <div class="form-group" id="tipoElementoGroup" style="display:none;">
          <label for="tipoElemento" data-i18n="form.elementType">Element type *</label>
          <select id="tipoElemento" name="tipoElemento">
            <option value="" data-i18n="form.elementTypePick">Select type</option>
          </select>
        </div>

        <div class="form-group" id="mobilityGroup" style="display:none;">
          <label for="mobility" data-i18n="form.mobility">Mobility</label>
          <select id="mobility" name="mobility">
            <option value="" data-i18n="form.pick">Select</option>
            <option value="air" data-i18n="mobility.air">Air</option>
            <option value="ground" data-i18n="mobility.ground">Ground</option>
            <option value="sea" data-i18n="mobility.sea">Sea</option>
          </select>
        </div>

        <div class="form-group" id="casevacGroup" style="display:none;">
          <label class="form-check">
            <input type="checkbox" id="casevacEligible" name="casevacEligible" />
            <span data-i18n="form.casevac">CASEVAC eligible — can carry out improvised evacuations</span>
          </label>
        </div>

        <div id="casualtyMedicalGroup" class="form-section" style="display:none;">
          <div class="form-group">
            <label for="casualtyStatus" data-i18n="form.casualtyStatus">Casualty status *</label>
            <select id="casualtyStatus" name="casualtyStatus">
              <option value="WIA" data-i18n="status.wia">WIA — Wounded in action</option>
              <option value="KIA" data-i18n="status.kia">KIA — Killed in action</option>
              <option value="UNKNOWN" data-i18n="status.unknown">UNKNOWN</option>
            </select>
          </div>

          <div id="triageGroup">
            <div class="form-group">
              <label for="triageColor" data-i18n="form.triage">Triage *</label>
              <select id="triageColor" name="triageColor">
                <option value="RED" data-i18n="triage.t1">T1 Immediate</option>
                <option value="YELLOW" data-i18n="triage.t2">T2 Urgent</option>
                <option value="GREEN" data-i18n="triage.t3">T3 Minimal</option>
                <option value="BLUE" data-i18n="triage.t4">T4 Expectant</option>
                <option value="UNKNOWN" selected data-i18n="triage.unknown">Unknown</option>
              </select>
            </div>

            <div class="form-group">
              <label for="injuryMechanism" data-i18n="form.mechanism">Injury mechanism</label>
              <input type="text" id="injuryMechanism" name="injuryMechanism" placeholder="GSW, blast, MVA…" />
            </div>

            <div class="form-group">
              <label for="primaryInjury" data-i18n="form.primaryInjury">Primary injury</label>
              <input type="text" id="primaryInjury" name="primaryInjury" data-i18n-ph="form.primaryInjuryPh" placeholder="Describe the primary injury…" />
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="country" data-i18n="form.country">Country</label>
          <input type="text" id="country" name="country" placeholder="Spain, France…"/>
        </div>

        <div class="form-group">
          <label for="alliance" data-i18n="form.alliance">Alliance *</label>
          <select id="alliance" name="alliance" required>
            <option value="friendly" data-i18n="alliance.friendly">Friendly</option>
            <option value="hostile" data-i18n="alliance.hostile">Hostile</option>
            <option value="neutral" data-i18n="alliance.neutral">Neutral</option>
            <option value="unknown" selected data-i18n="alliance.unknown">Unknown</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="latitud" data-i18n="form.lat">Latitude *</label>
            <input type="number" id="latitud" name="latitud" step="any" required />
          </div>
          <div class="form-group">
            <label for="longitud" data-i18n="form.lng">Longitude *</label>
            <input type="number" id="longitud" name="longitud" step="any" required />
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" data-i18n="form.save">Save entity</button>
          <button type="button" class="btn btn-secondary" onclick="cerrarFormularioNuevoPunto()" data-i18n="action.cancel">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>

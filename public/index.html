<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CMOP — Common Medical Operational Picture</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="/css/styles.css"/>
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-header-text">
          <h1>CMOP</h1>
          <p>Common Medical Operational Picture</p>
        </div>
        <button class="btn-theme" id="themeToggle" title="Toggle dark mode">🌙</button>
      </div>

      <div class="sidebar-content">

        <!-- ============================================================
             Scenario selector
             ============================================================ -->
        <div class="scenario-block">
          <label for="scenarioSelect">🎬 Escenario</label>
          <div class="scenario-row">
            <select id="scenarioSelect">
              <option value="">Cargando escenarios…</option>
            </select>
            <button class="btn btn-scenario" id="loadScenarioBtn">Cargar</button>
          </div>
        </div>

        <!-- ============================================================
             Stats
             ============================================================ -->
        <div class="stats">
          <h3>📊 Estadísticas</h3>
          <div class="stat-item">
            <span class="stat-label">Entidades:</span>
            <span class="stat-value" id="totalPuntos">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Categorías:</span>
            <span class="stat-value" id="totalCategorias">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Casualties:</span>
            <span class="stat-value stat-casualties" id="totalCasualties">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Triage:</span>
            <span class="stat-value" id="triageCounts">
              <span class="triage-pill RED">0</span>
              <span class="triage-pill YELLOW">0</span>
              <span class="triage-pill GREEN">0</span>
            </span>
          </div>
        </div>

        <!-- ============================================================
             Filters
             ============================================================ -->
        <div class="controls">

          <!-- Category multi-select -->
          <div class="filter-section">
            <div class="filter-section-header" data-toggle="categoriesBody">
              <span>🏷️ Categorías</span>
              <div class="filter-section-actions">
                <button class="btn-clear" id="clearCategories" title="Limpiar">Limpiar</button>
                <span class="chevron">▾</span>
              </div>
            </div>
            <div class="filter-section-body" id="categoriesBody">
              <div class="checkbox-grid" id="categoryCheckboxes">
                <!-- Military -->
                <label class="filter-cb"><input type="checkbox" value="infantry" /><span>Infantry</span></label>
                <label class="filter-cb"><input type="checkbox" value="armoured" /><span>Armoured</span></label>
                <label class="filter-cb"><input type="checkbox" value="artillery" /><span>Artillery</span></label>
                <label class="filter-cb"><input type="checkbox" value="reconnaissance" /><span>Recon</span></label>
                <label class="filter-cb"><input type="checkbox" value="engineer" /><span>Engineer</span></label>
                <label class="filter-cb"><input type="checkbox" value="mortar" /><span>Mortar</span></label>
                <label class="filter-cb"><input type="checkbox" value="helicopter" /><span>Helicopter</span></label>
                <label class="filter-cb"><input type="checkbox" value="uav" /><span>UAV</span></label>
                <label class="filter-cb"><input type="checkbox" value="ugv" /><span>UGV</span></label>
                <label class="filter-cb"><input type="checkbox" value="transportation" /><span>Transport</span></label>
                <label class="filter-cb"><input type="checkbox" value="aircraft" /><span>Aircraft</span></label>
                <!-- Medical -->
                <label class="filter-cb filter-cb--medical"><input type="checkbox" value="casualty" /><span>Casualty</span></label>
                <label class="filter-cb filter-cb--medical"><input type="checkbox" value="medical_facility" /><span>Med Facility</span></label>
                <label class="filter-cb filter-cb--medical"><input type="checkbox" value="medevac_unit" /><span>MEDEVAC</span></label>
                <label class="filter-cb filter-cb--medical"><input type="checkbox" id="casevacFilter" /><span>CASEVAC eligible</span></label>
                <!-- Other military -->
                <label class="filter-cb"><input type="checkbox" value="missile" /><span>Missile</span></label>
                <label class="filter-cb"><input type="checkbox" value="fighter" /><span>Fighter</span></label>
                <label class="filter-cb"><input type="checkbox" value="bomber" /><span>Bomber</span></label>
                <label class="filter-cb"><input type="checkbox" value="ship" /><span>Ship</span></label>
                <label class="filter-cb"><input type="checkbox" value="destroyer" /><span>Destroyer</span></label>
                <label class="filter-cb"><input type="checkbox" value="submarine" /><span>Submarine</span></label>
                <label class="filter-cb"><input type="checkbox" value="ground_vehicle" /><span>Ground Veh.</span></label>
                <label class="filter-cb"><input type="checkbox" value="person" /><span>Person</span></label>
                <label class="filter-cb"><input type="checkbox" value="base" /><span>Base</span></label>
                <label class="filter-cb"><input type="checkbox" value="building" /><span>Building</span></label>
                <label class="filter-cb"><input type="checkbox" value="infrastructure" /><span>Infrastructure</span></label>
              </div>

              <!-- Casualty triage subfilter -->
              <div class="subfilter" id="subfilterCasualty" style="display:none;">
                <div class="subfilter-header">
                  <span>Triage Level</span>
                  <button class="btn-clear" id="clearTriageFilter">Limpiar</button>
                </div>
                <div class="subfilter-options" id="triageCheckboxes">
                  <label class="filter-cb triage-option">
                    <input type="checkbox" value="RED" />
                    <span class="triage-pill RED">T1 — Immediate</span>
                  </label>
                  <label class="filter-cb triage-option">
                    <input type="checkbox" value="YELLOW" />
                    <span class="triage-pill YELLOW">T2 — Urgent</span>
                  </label>
                  <label class="filter-cb triage-option">
                    <input type="checkbox" value="GREEN" />
                    <span class="triage-pill GREEN">T3 — Minimal</span>
                  </label>
                  <label class="filter-cb triage-option">
                    <input type="checkbox" value="BLUE" />
                    <span class="triage-pill BLUE">T4 — Expectant</span>
                  </label>
                  <label class="filter-cb triage-option">
                    <input type="checkbox" value="BLACK" />
                    <span class="triage-pill BLACK">Dead</span>
                  </label>
                  <label class="filter-cb triage-option">
                    <input type="checkbox" value="UNKNOWN" />
                    <span class="triage-pill UNKNOWN">Unknown</span>
                  </label>
                </div>
              </div>

              <!-- Medical facility role subfilter -->
              <div class="subfilter" id="subfilterMedFacility" style="display:none;">
                <div class="subfilter-header">
                  <span>Facility Role</span>
                  <button class="btn-clear" id="clearMedFacilityFilter">Limpiar</button>
                </div>
                <div class="subfilter-options" id="medFacilityCheckboxes">
                  <label class="filter-cb"><input type="checkbox" value="medical_role_1" /><span>Role 1 — Aid Post</span></label>
                  <label class="filter-cb"><input type="checkbox" value="medical_role_2" /><span>Role 2 — Surgical</span></label>
                  <label class="filter-cb"><input type="checkbox" value="medical_role_3" /><span>Role 3 — Field Hospital</span></label>
                  <label class="filter-cb"><input type="checkbox" value="medical_role_4" /><span>Role 4 — Definitive</span></label>
                  <label class="filter-cb"><input type="checkbox" value="medical_other" /><span>Other (R2B/R2E/Multi)</span></label>
                </div>
              </div>

              <!-- MEDEVAC role subfilter -->
              <div class="subfilter" id="subfilterMedevac" style="display:none;">
                <div class="subfilter-header">
                  <span>MEDEVAC Role</span>
                  <button class="btn-clear" id="clearMedevacFilter">Limpiar</button>
                </div>
                <div class="subfilter-options" id="medevacCheckboxes">
                  <label class="filter-cb"><input type="checkbox" value="medevac_role_1" /><span>Role 1 — Immediate</span></label>
                  <label class="filter-cb"><input type="checkbox" value="medevac_role_2" /><span>Role 2 — Forward</span></label>
                  <label class="filter-cb"><input type="checkbox" value="medevac_role_3" /><span>Role 3 — Theater</span></label>
                  <label class="filter-cb"><input type="checkbox" value="medevac_role_4" /><span>Role 4 — Definitive</span></label>
                  <label class="filter-cb"><input type="checkbox" value="medevac_other" /><span>Other (FW/Amb/Mech/Mort)</span></label>
                </div>
              </div>

            </div>
          </div>

          <!-- Alliance filter -->
          <div class="filter-section">
            <div class="filter-section-header" data-toggle="allianceBody">
              <span>🛡️ Alianza</span>
              <div class="filter-section-actions">
                <button class="btn-clear" id="clearAlliance" title="Limpiar">Limpiar</button>
                <span class="chevron">▾</span>
              </div>
            </div>
            <div class="filter-section-body collapsed" id="allianceBody">
              <div class="checkbox-grid" id="allianceCheckboxes">
                <label class="filter-cb"><input type="checkbox" value="friendly" /><span class="alliance-dot" style="--dot-color:#00AEEF"></span><span>Friendly</span></label>
                <label class="filter-cb"><input type="checkbox" value="hostile" /><span class="alliance-dot" style="--dot-color:#FF0000"></span><span>Hostile</span></label>
                <label class="filter-cb"><input type="checkbox" value="neutral" /><span class="alliance-dot" style="--dot-color:#ADFF2F"></span><span>Neutral</span></label>
                <label class="filter-cb"><input type="checkbox" value="unknown" /><span class="alliance-dot" style="--dot-color:#A9A9A9"></span><span>Unknown</span></label>
              </div>
            </div>
          </div>

          <!-- MEDEVAC Routes -->
          <div class="filter-section">
            <div class="filter-section-header" data-toggle="routesBody">
              <span>🚑  MEDEVAC Routes</span>
              <span class="chevron">▾</span>
            </div>
            <div class="filter-section-body collapsed" id="routesBody">
              <div class="routes-panel">
                <div class="routes-input-row">
                  <input type="text" id="routeTaskId" placeholder="Task ID…" class="search-input routes-task-input"/>
                  <button class="btn btn-route-load" id="loadRoutesBtn">Cargar</button>
                </div>
                <div id="routesStatus" class="routes-status"></div>
                <div class="routes-actions" style="display:none;" id="routesActions">
                  <button class="btn btn-route-refresh" id="refreshRoutesBtn">↺ Actualizar</button>
                  <button class="btn btn-simulate" id="simulateBtn" onclick="toggleSimulation()">▶ Simular</button>
                  <button class="btn btn-restart" id="restartBtn" onclick="restartSimulation()" style="display:none;">↩ Reiniciar</button>
                  <button class="btn btn-secondary routes-clear-btn" id="clearRoutesBtn">🗑️ Limpiar</button>
                </div>
              </div>
            </div>
          </div>

          <!-- Search -->
          <div class="filter-section">
            <div class="filter-section-header" data-toggle="searchBody">
              <span>🔍 Buscar</span>
              <span class="chevron">▾</span>
            </div>
            <div class="filter-section-body collapsed" id="searchBody">
              <input type="text" id="buscarNombre" placeholder="Escribe un nombre…" class="search-input"/>
            </div>
          </div>

          <!-- Action buttons -->
          <div class="filter-actions">
            <button class="btn btn-primary" onclick="mostrarFormularioNuevoPunto()">➕ Nueva entidad</button>
            <!-- <button class="btn btn-secondary" onclick="centrarMapa()">🎯 Centrar en España</button> --> 
          </div>
        </div>

        <div id="message" class="message"></div>

        <!-- ============================================================
             Entity list
             ============================================================ -->
        <div class="puntos-list" id="puntosList">
          <p style="text-align:center;color:#999;">Cargando…</p>
        </div>
      </div>
    </aside>

    <!-- ================================================================
         Map
         ================================================================ -->
    <main class="map-container">
      <div id="map"></div>
      <div id="map-coords" class="map-coords"></div>
      <div id="map-ctx-menu" class="map-ctx-menu" style="display:none;">
        <button id="map-ctx-add">📍 Añadir nueva entidad aquí</button>
      </div>
      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Cargando…</p>
      </div>
    </main>
  </div>

  <!-- ================================================================
       Modal — create entity
       ================================================================ -->
  <div class="form-modal" id="formModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>➕ Nueva entidad</h2>
        <button class="close-btn" onclick="cerrarFormularioNuevoPunto()">&times;</button>
      </div>

      <form id="nuevoPuntoForm">
        <div class="form-group">
          <label for="nombre">Nombre *</label>
          <input type="text" id="nombre" name="nombre" required />
        </div>

        <div class="form-group">
          <label for="descripcion">Descripción</label>
          <textarea id="descripcion" name="descripcion"></textarea>
        </div>

        <div class="form-group">
          <label for="categoria">Categoría *</label>
          <select id="categoria" name="categoria" required>
            <option value="">Selecciona una categoría</option>

            <!-- Military -->
            <optgroup label="── Military ──">
              <option value="missile">missile — Misil</option>
              <option value="fighter">fighter — Caza</option>
              <option value="bomber">bomber — Bombardero</option>
              <option value="aircraft">aircraft — Aeronave</option>
              <option value="helicopter">helicopter — Helicóptero</option>
              <option value="uav">uav — UAV/Drone</option>
              <option value="ugv">ugv — Unmanned Ground Vehicle</option>
              <option value="transportation">transportation — Transporte</option>
              <option value="armoured">armoured — Carro de Combate / Blindado</option>
              <option value="artillery">artillery — Artillería</option>
              <option value="ship">ship — Buque</option>
              <option value="destroyer">destroyer — Destructor</option>
              <option value="submarine">submarine — Submarino</option>
              <option value="ground_vehicle">ground_vehicle — Vehículo Terrestre</option>
              <option value="infantry">infantry — Infantería</option>
              <option value="reconnaissance">reconnaissance — Reconocimiento / Caballería</option>
              <option value="engineer">engineer — Ingenieros</option>
              <option value="mortar">mortar — Mortero</option>
              <option value="person">person — Persona</option>
              <option value="base">base — Base</option>
              <option value="building">building — Edificio</option>
              <option value="infrastructure">infrastructure — Infraestructura</option>
            </optgroup>

            <!-- Medical & MEDEVAC -->
            <optgroup label="── Medical & MEDEVAC ──">
              <option value="medical_facility">medical_facility — Medical Facility</option>
              <option value="medevac_unit">medevac_unit — MEDEVAC Asset</option>
            </optgroup>

            <!-- Casualties -->
            <optgroup label="── Casualties ──">
              <option value="casualty">casualty — Casualty</option>
            </optgroup>

            <option value="default">default</option>
          </select>
        </div>

        <!-- Tipo Elemento (dynamic, shown only for categories with subtypes) -->
        <div class="form-group" id="tipoElementoGroup" style="display:none;">
          <label for="tipoElemento">Tipo Elemento *</label>
          <select id="tipoElemento" name="tipoElemento">
            <option value="">— Selecciona tipo —</option>
          </select>
        </div>

        <!-- Mobility (only for medevac_unit, transportation, reconnaissance) -->
        <div class="form-group" id="mobilityGroup" style="display:none;">
          <label for="mobility">Mobility</label>
          <select id="mobility" name="mobility">
            <option value="">— Selecciona —</option>
            <option value="air">Air — Aéreo</option>
            <option value="ground">Ground — Terrestre</option>
            <option value="sea">Sea — Marítimo</option>
          </select>
        </div>

        <!-- CASEVAC eligible (only for vehicle categories that can carry personnel) -->
        <div class="form-group" id="casevacGroup" style="display:none;">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
            <input type="checkbox" id="casevacEligible" name="casevacEligible" />
            CASEVAC eligible — puede realizar evacuaciones improvisadas
          </label>
        </div>

        <!-- Casualty medical details (only when categoria = casualty) -->
        <div id="casualtyMedicalGroup" style="display:none;border-top:1px solid #444;padding-top:10px;margin-top:4px;">
          <div class="form-group">
            <label for="casualtyStatus">Estado Baja *</label>
            <select id="casualtyStatus" name="casualtyStatus">
              <option value="WIA">WIA — Herido en Acción</option>
              <option value="KIA">KIA — Muerto en Acción</option>
              <option value="UNKNOWN">UNKNOWN — Desconocido</option>
            </select>
          </div>

          <!-- Triage (hidden for KIA; KIA always gets BLACK triage server-side) -->
          <div id="triageGroup">
            <div class="form-group">
              <label for="triageColor">Triage *</label>
              <select id="triageColor" name="triageColor">
                <option value="RED">🔴 RED — T1 Inmediate</option>
                <option value="YELLOW">🟡 YELLOW — T2 Urgent</option>
                <option value="GREEN">🟢 GREEN — T3 Minimal</option>
                <option value="BLUE">🔵 BLUE — T4 Expectant</option>
                <option value="UNKNOWN" selected>⚪ UNKNOWN</option>
              </select>
            </div>

            <div class="form-group">
              <label for="injuryMechanism">Mecanismo de lesión</label>
              <input type="text" id="injuryMechanism" name="injuryMechanism" placeholder="GSW, blast, MVA…" />
            </div>

            <div class="form-group">
              <label for="primaryInjury">Lesión principal</label>
              <input type="text" id="primaryInjury" name="primaryInjury" placeholder="Describe la lesión principal…" />
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="country">Country</label>
          <input type="text" id="country" name="country" placeholder="Spain, France…"/>
        </div>

        <div class="form-group">
          <label for="alliance">Alliance *</label>
          <select id="alliance" name="alliance" required>
            <option value="friendly">friendly</option>
            <option value="hostile">hostile</option>
            <option value="neutral">neutral</option>
            <option value="unknown" selected>unknown</option>
          </select>
        </div>

        <div style="display:flex;gap:10px;">
          <div class="form-group" style="flex:1;">
            <label for="latitud">Latitud *</label>
            <input type="number" id="latitud" name="latitud" step="any" required />
          </div>
          <div class="form-group" style="flex:1;">
            <label for="longitud">Longitud *</label>
            <input type="number" id="longitud" name="longitud" step="any" required />
          </div>
        </div>

        <div style="display:flex;gap:10px;margin-top:10px;">
          <button type="submit" class="btn btn-primary">Guardar</button>
          <button type="button" class="btn btn-secondary" onclick="cerrarFormularioNuevoPunto()">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
